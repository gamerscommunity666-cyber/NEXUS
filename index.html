<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>NEXUS — AURELIS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050309;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
#game{position:fixed;inset:0;overflow:hidden}
#rotate{position:fixed;inset:0;z-index:100;background:#08050d;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}
#rotate div{font-size:22px;font-weight:bold;line-height:1.5}
#rotate span{display:block;font-size:50px;margin-bottom:15px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#topLeft{position:absolute;top:18px;left:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:min(430px,58vw)}
#objective{padding:10px 15px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(5,3,9,.58);backdrop-filter:blur(8px);font-size:13px;letter-spacing:1px}
#objective b{display:block;color:#b99cff;font-size:10px;margin-bottom:4px}
#objectiveText{display:block;font-weight:bold;font-size:14px}
#objectiveSub{display:block;margin-top:5px;font-size:10px;letter-spacing:.8px;color:#d9c9ff;opacity:.9}
#objective.pulse{animation:pulse .9s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,102,255,.9);border-color:#b066ff}100%{box-shadow:0 0 0 14px rgba(176,102,255,0)}}
#inv{display:none;gap:6px;flex-wrap:wrap}
.chip{padding:5px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(5,3,9,.58);backdrop-filter:blur(8px);font-size:10px;letter-spacing:.8px;white-space:nowrap}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip b{margin-left:5px}
.chip.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#status{position:absolute;left:18px;bottom:18px;font-size:11px;color:#d9d0e8;background:rgba(5,3,9,.5);padding:7px 10px;border-radius:8px}
#toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:10px;border:1px solid rgba(180,140,255,.35);background:rgba(8,5,15,.8);backdrop-filter:blur(8px);font-size:12px;letter-spacing:1px;display:none;text-align:center;max-width:36vw}
#message{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);width:min(620px,82vw);padding:15px 18px;border-radius:12px;border:1px solid rgba(180,140,255,.4);background:rgba(8,5,15,.84);backdrop-filter:blur(10px);font-size:14px;line-height:1.5;display:none;text-align:center}
#message .spk{display:block;font-size:10px;letter-spacing:2px;margin-bottom:5px}
#prompt{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;border:1px solid rgba(185,156,255,.6);background:rgba(40,20,70,.6);backdrop-filter:blur(8px);font-size:12px;letter-spacing:2px;display:none;white-space:nowrap}
#progress{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);width:min(280px,60vw);display:none;text-align:center;font-size:11px;letter-spacing:2px}
#progBar{height:6px;margin-top:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#progBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a4dff,#6fe0ff)}
#wp{position:absolute;left:0;top:0;width:0;height:0;display:none;--c:#b99cff}
#wp .dia{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border:2px solid var(--c);transform:rotate(45deg);box-shadow:0 0 12px var(--c);background:rgba(0,0,0,.3)}
#wp .lbl{position:absolute;left:-70px;width:140px;top:14px;text-align:center;font-size:10px;letter-spacing:1px;color:#fff;text-shadow:0 0 6px #000,0 0 3px #000}
#wp .arr{position:absolute;left:-12px;top:-12px;width:24px;height:24px;display:none;color:var(--c);font-size:22px;line-height:24px;text-align:center;text-shadow:0 0 10px var(--c)}

#controls{position:fixed;inset:0;z-index:20;pointer-events:none}
#lookArea{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}
#joystickZone{position:absolute;left:0;bottom:0;width:48%;height:72%;pointer-events:auto}
#joystick{position:absolute;width:132px;height:132px;border-radius:50%;display:none;pointer-events:none;border:2px solid rgba(210,180,255,.32);background:rgba(90,55,120,.14);box-shadow:0 0 25px rgba(130,80,220,.12)}
#stick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(210,185,255,.42);border:2px solid rgba(255,255,255,.5);box-shadow:0 5px 20px rgba(0,0,0,.35)}
.btn{position:absolute;pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(18,12,28,.55);color:#fff;border-radius:50%;font-size:11px;font-weight:bold;backdrop-filter:blur(8px);width:62px;height:62px;touch-action:none}
.btn:active{transform:scale(.94);background:rgba(120,75,170,.55)}
#useBtn{right:26px;bottom:29%;width:70px;height:70px}
#jumpBtn{right:105px;bottom:17%;width:58px;height:58px}
#camBtn{right:25px;bottom:13%;width:58px;height:58px}
#hint{position:absolute;right:25px;top:18px;font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.7px}
#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#29143b 0,#09060e 48%,#020205 100%)}
#startPanel{text-align:center;width:min(560px,88vw);padding:28px}
#startPanel h1{font-size:clamp(42px,10vw,76px);letter-spacing:10px;margin:0 0 6px}
#startPanel p{color:#aaa1b8;letter-spacing:2px;margin:0 0 28px}
#play{border:1px solid #b88aff;background:rgba(130,75,190,.18);color:white;padding:15px 42px;border-radius:12px;font-weight:bold;letter-spacing:3px;font-size:14px}
#play:active{transform:scale(.97)}
#loading{margin-top:16px;font-size:11px;color:#756b80}
@media (orientation:portrait){
 #rotate{display:flex}
 #start{display:none}
}
</style>
</head>

<div id="hud">

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* ============================================================
   NEXUS V0.4 — AURELIS — Chapter 1 opening sequence
   ============================================================ */

let scene,camera,renderer,clock;
let player,ship,nova,terrain;
let novaBall,novaSensor,novaEyeMat;
let workbench=null,neutronDevice=null;
let beamG,beamMat,linkBeam;
let started=false,thirdPerson=false;
let yaw=0,pitch=0.18;
let velocityX=0,velocityZ=0,velocityY=0,grounded=true;
let joystickActive=false,joyId=null;
let joyX=0,joyY=0;
let lookId=null,lastLookX=0,lastLookY=0;
const keys={};

const game=document.getElementById("game");
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const joystickZone=document.getElementById("joystickZone");
const lookArea=document.getElementById("lookArea");
const message=document.getElementById("message");
const toastEl=document.getElementById("toast");
const objectiveBox=document.getElementById("objective");
const objectiveText=document.getElementById("objectiveText");
const objectiveSub=document.getElementById("objectiveSub");
const invEl=document.getElementById("inv");
const promptEl=document.getElementById("prompt");
const progressEl=document.getElementById("progress");
const progLabel=document.getElementById("progLabel");
const progFill=document.querySelector("#progBar i");
const wpEl=document.getElementById("wp");
const wpDia=wpEl.querySelector(".dia");
const wpArr=wpEl.querySelector(".arr");
const wpLbl=wpEl.querySelector(".lbl");
const loading=document.getElementById("loading");

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(20260);
const rr=(a,b)=>a+(b-a)*rand();
function makeMat(color,rough=1,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
function glowMat(color,opacity=.2){
 return new THREE.MeshBasicMaterial({color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
}
function lerpAngle(a,b,k){
 const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
 return a+d*k;
}
const dist2D=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);

/* Same formula as the terrain mesh, so we can read ground height anywhere without raycasting.
   Plane is rotated -90deg on X: world z = -(plane y). */
function terrainHeight(wx,wz){
 const x=wx,z=-wz;
 let h=Math.sin(x*.055)*2.5+Math.cos(z*.047)*2.2+Math.sin((x+z)*.025)*3;
 h+=Math.max(0,Math.sin(x*.015)*Math.cos(z*.021))*3;
 return h;
}

/* ---------- story data ---------- */
const NOVA_SPOT={x:-17,z:-24};
const SHIP_SPOT={x:0,z:-5};
const RES={
 metal:{label:"METAL",color:0xc9d2e8,css:"#c9d2e8"},
 energy:{label:"ENERGY",color:0xb066ff,css:"#b066ff"},
 parts:{label:"COMPONENTS",color:0x35e0ff,css:"#35e0ff"}
};
const NEED={metal:5,energy:3,parts:3};        // total needed (workbench + NEUTRON)
const WB_COST={metal:3,parts:1};
const NEUT_COST={metal:2,energy:3,parts:2};
const inv={metal:0,energy:0,parts:0};
let neutronBuilt=false;

const ORDER=["HEMTON","NOVA","GATHER","WORKBENCH","NEUTRON","REPAIR","FOLLOW"];
const OBJ={
 HEMTON:"TALK TO HEMTON",NOVA:"FIND NOVA",GATHER:"GATHER RESOURCES",
 WORKBENCH:"BUILD WORKBENCH",NEUTRON:"BUILD NEUTRON",REPAIR:"REPAIR NOVA",FOLLOW:"FOLLOW NOVA"
};
let state="HEMTON";
let novaMode="damaged"; // damaged | repairing | online
let busy=false;

const HEMTON_HINT={
 HEMTON:["Systems are unstable. Approach the console."],
 NOVA:["Auxiliary unit NOVA detected nearby.","Follow the signal."],
 GATHER:["Salvage Metal, Energy and Components from the crash site."],
 WORKBENCH:["Build a workbench on open ground, away from the wreckage."],
 NEUTRON:["Fabricate the NEUTRON at your workbench."],
 REPAIR:["Bring the NEUTRON to NOVA."],
 FOLLOW:["NOVA is online. Resume survey of AURELIS."]
};
const NOVA_HINT={
 GATHER:["Salvage Metal, Energy and Components.","Pieces of the wreck are scattered all around."],
 WORKBENCH:["Find some open ground and build a workbench."],
 NEUTRON:["The NEUTRON has to be built at the workbench."],
 REPAIR:["I am ready. Bring the NEUTRON close."],
 FOLLOW:["Systems nominal. Lead the way."]
};

/* ---------- world ---------- */
function createTerrain(){
 const geo=new THREE.PlaneGeometry(500,500,80,80);
 const p=geo.attributes.position;
 for(let i=0;i<p.count;i++){
   const x=p.getX(i),z=p.getY(i);
   let h=Math.sin(x*.055)*2.5+Math.cos(z*.047)*2.2+Math.sin((x+z)*.025)*3;
   h+=Math.max(0,Math.sin(x*.015)*Math.cos(z*.021))*3;
   p.setZ(i,h);
 }
 geo.computeVertexNormals();
 terrain=new THREE.Mesh(geo,makeMat(0x673927,1,0));
 terrain.rotation.x=-Math.PI/2;
 terrain.name="AURELIS_TERRAIN";
 scene.add(terrain);

 const rockMat=makeMat(0x43241e,1,0);
 function addRock(x,z,size,sy=1){
   const r=new THREE.Mesh(new THREE.DodecahedronGeometry(size,1),rockMat);
   r.position.set(x,terrainHeight(x,z)+size*.35*sy,z);
   r.scale.y=sy;
   r.rotation.set(rand()*2,rand()*3,rand()*2);
   scene.add(r);
 }
 // Giant rock formations far from the crash site
 let placed=0,tries=0;
 while(placed<55 && tries<400){
   tries++;
   const x=(rand()-.5)*440,z=(rand()-.5)*440;
   if(Math.hypot(x,z)<48)continue;
   addRock(x,z,rr(2,8),rr(.6,1.8));
   placed++;
 }
 // Small rocks around the crash site
 for(let i=0;i<20;i++){
   const a=rand()*Math.PI*2,r=rr(14,46);
   const x=Math.cos(a)*r,z=-5+Math.sin(a)*r;
   if(Math.hypot(x-NOVA_SPOT.x,z-NOVA_SPOT.z)<9)continue;
   addRock(x,z,rr(.6,1.7),rr(.7,1.3));
 }
 // Rock nook that hides NOVA
 addRock(NOVA_SPOT.x-6,NOVA_SPOT.z-2,3.4,1.5);
 addRock(NOVA_SPOT.x+5,NOVA_SPOT.z-5,2.8,1.3);
 addRock(NOVA_SPOT.x-1,NOVA_SPOT.z-8,4.4,1.6);
}

function createPlayer(){
 player=new THREE.Group();
 const suit=makeMat(0x292832,.8,.25);
 const white=makeMat(0xd7d7dc,.55,.35);
 const visor=makeMat(0x170d24,.2,.75);

 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,8,16),suit);
 body.position.y=1.35; player.add(body);
 const chest=new THREE.Mesh(new THREE.BoxGeometry(.72,.65,.3),white);
 chest.position.set(0,1.5,.05); player.add(chest);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),makeMat(0xb77b60,.8,0));
 head.position.y=2.25; player.add(head);
 const visorM=new THREE.Mesh(new THREE.SphereGeometry(.25,16,10),visor);
 visorM.scale.set(1,.65,.35); visorM.position.set(0,2.27,.29); player.add(visorM);

 for(const s of [-1,1]){
   const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.75,6,10),suit);
   leg.position.set(s*.19,.65,0); player.add(leg);
   const boot=new THREE.Mesh(new THREE.BoxGeometry(.27,.18,.45),makeMat(0x111116,.7,.5));
   boot.position.set(s*.19,.18,.07); player.add(boot);
   const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.65,6,10),suit);
   arm.rotation.z=s*.13; arm.position.set(s*.56,1.48,0); player.add(arm);
 }
 player.position.set(0,terrainHeight(0,6),6);
 scene.add(player);
}

function createShip(){
 ship=new THREE.Group();
 const hull=makeMat(0x5d6068,.42,.82), hullDark=makeMat(0x20242b,.34,.9), panel=makeMat(0x343840,.58,.72), damaged=makeMat(0x241d22,.88,.18), glass=makeMat(0x161b28,.16,.8);
 const purple=new THREE.MeshBasicMaterial({color:0x9c65ff}), red=new THREE.MeshBasicMaterial({color:0xff3b32}), orange=new THREE.MeshBasicMaterial({color:0xff8a32});
 const body=new THREE.Mesh(new THREE.BoxGeometry(7.8,1.9,3.2),hull); body.position.set(-.2,2.65,0); body.rotation.z=-.055; ship.add(body);
 const spine=new THREE.Mesh(new THREE.BoxGeometry(5.4,.72,1.55),panel); spine.position.set(-.45,3.72,0); spine.rotation.z=-.10; ship.add(spine);
 const cockpit=new THREE.Mesh(new THREE.BoxGeometry(2.15,1.15,2.45),glass); cockpit.position.set(3.0,3.12,0); cockpit.rotation.z=-.25; cockpit.rotation.y=.08; ship.add(cockpit);
 const frame=new THREE.Mesh(new THREE.BoxGeometry(2.35,.18,2.7),hullDark); frame.position.set(3.0,3.62,0); frame.rotation.z=-.25; ship.add(frame);
 for(const side of [-1,1]){ const wing=new THREE.Mesh(new THREE.BoxGeometry(4.4,.28,1.65),hullDark); wing.position.set(-.75,2.05,side*2.35); wing.rotation.y=side*.16; wing.rotation.z=-side*.08; ship.add(wing); const tip=new THREE.Mesh(new THREE.BoxGeometry(1.7,.18,1.0),damaged); tip.position.set(-2.7,1.88,side*3.35); tip.rotation.y=side*.28; ship.add(tip); }
 for(const side of [-1,1]){ const eng=new THREE.Mesh(new THREE.CylinderGeometry(.62,.72,2.1,12),hullDark); eng.rotation.z=Math.PI/2; eng.position.set(-4,2.55,side*.88); ship.add(eng); const ex=new THREE.Mesh(new THREE.CylinderGeometry(.38,.52,.16,12),orange); ex.rotation.z=Math.PI/2; ex.position.set(-5.08,2.55,side*.88); ship.add(ex); }
 const broken=new THREE.Mesh(new THREE.CylinderGeometry(.48,.68,1.7,10),damaged); broken.rotation.z=Math.PI/2; broken.position.set(-4.15,2.25,0); ship.add(broken);
 for(const side of [-1,1]){ const strut=new THREE.Mesh(new THREE.BoxGeometry(.22,1.3,.22),hullDark); strut.position.set(-1.2,1.25,side*1); strut.rotation.z=side*.22; ship.add(strut); }
 for(let i=0;i<5;i++){ const cable=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.9+Math.random()*.6,6),red); cable.rotation.z=Math.PI/2+(i-2)*.13; cable.position.set(-1.7+i*.42,2.35,.98); ship.add(cable); }
 for(let i=0;i<7;i++){ const panelPiece=new THREE.Mesh(new THREE.BoxGeometry(.65+Math.random()*.7,.10,.42),damaged); panelPiece.position.set(-3.1+Math.random()*5.2,2+Math.random()*1.2,-1.75-Math.random()*.35); panelPiece.rotation.set(Math.random()*.4,Math.random()*.8,Math.random()*1.2); ship.add(panelPiece); }
 for(const x of [-2.7,-1.4,-.1,1.2]){ const light=new THREE.Mesh(new THREE.BoxGeometry(.58,.055,.08),purple); light.position.set(x,3.63,1.63); ship.add(light); }
 const beacon=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),red); beacon.position.set(-2.2,3.98,.18); ship.add(beacon);
 for(let i=0;i<9;i++){ const spark=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),orange); spark.position.set(-1.5+Math.random()*2.4,1.9+Math.random()*1.4,.95+Math.random()*.35); ship.add(spark); }
 ship.position.set(SHIP_SPOT.x,terrainHeight(SHIP_SPOT.x,SHIP_SPOT.z)+.35,SHIP_SPOT.z); ship.rotation.y=-.25; ship.rotation.z=.10; ship.rotation.x=-.035; scene.add(ship);
 for(let i=0;i<8;i++){ const d=new THREE.Mesh(new THREE.BoxGeometry(.18+Math.random()*.45,.12+Math.random()*.25,.2+Math.random()*.5),damaged); const x=SHIP_SPOT.x-4+Math.random()*8, z=SHIP_SPOT.z-5+Math.random()*10; d.position.set(x,terrainHeight(x,z)+.15,z); d.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2); scene.add(d); }
 const crateMat=makeMat(0x343840,.72,.55), crateDark=makeMat(0x171a1f,.55,.72), crateGlow=new THREE.MeshBasicMaterial({color:0x8d5cff});
 function addCrate(x,z,rot){ const c=new THREE.Group(); const box=new THREE.Mesh(new THREE.BoxGeometry(1.45,.9,1.15),crateMat); box.position.y=.55; c.add(box); for(const y of [.25,.85]){ const rail=new THREE.Mesh(new THREE.BoxGeometry(1.55,.10,1.24),crateDark); rail.position.y=y; c.add(rail); } const band=new THREE.Mesh(new THREE.BoxGeometry(.12,.98,1.25),crateDark); band.position.y=.55; c.add(band); const indicator=new THREE.Mesh(new THREE.BoxGeometry(.18,.08,.05),crateGlow); indicator.position.set(0,.94,.59); c.add(indicator); c.position.set(x,terrainHeight(x,z),z); c.rotation.y=rot; c.rotation.z=rot*.12; scene.add(c); }
 addCrate(SHIP_SPOT.x+5.2,SHIP_SPOT.z+2.4,.32); addCrate(SHIP_SPOT.x-4.8,SHIP_SPOT.z-2.2,-.55); addCrate(SHIP_SPOT.x+1.7,SHIP_SPOT.z-5.2,.85);
}

function createNova(){
 nova=new THREE.Group();            // root: position, heading, tilt
 novaBall=new THREE.Group();        // the part that rolls
 nova.add(novaBall);

 novaBall.add(new THREE.Mesh(new THREE.SphereGeometry(.65,20,14),makeMat(0x52545d,.45,.7)));
 // panel seams so you can see the ball roll
 const seamMat=makeMat(0x24252b,.5,.6);
 const s1=new THREE.Mesh(new THREE.TorusGeometry(.655,.022,6,28),seamMat);
 const s2=new THREE.Mesh(new THREE.TorusGeometry(.655,.022,6,28),seamMat);
 s2.rotation.y=Math.PI/2;
 const s3=new THREE.Mesh(new THREE.TorusGeometry(.655,.022,6,28),seamMat);
 s3.rotation.x=Math.PI/2;
 novaBall.add(s1,s2,s3);

 // Eye stays facing forward (does not roll)
 novaEyeMat=new THREE.MeshBasicMaterial({color:0x3a2658});
 const housing=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.12,16),makeMat(0x15151a,.4,.6));
 housing.rotation.x=Math.PI/2; housing.position.set(0,.15,.57);

function spawnPickups(){

 for(let i=list.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[list[i],list[j]]=[list[j],list[i]]}

 for(let i=0;i<n;i++){
   let x=0,z=0;

   }
   makePickup(list[i],x,z);
 }
}

/* ---------- tweens ---------- */
const tweens=[];
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done})}
function updateTweens(dt){
 for(let i=tweens.length-1;i>=0;i--){
   const tw=tweens[i];
   tw.t+=dt;
   const k=Math.min(1,tw.t/tw.dur);
   tw.fn(k);
   if(k>=1){tweens.splice(i,1);if(tw.done)tw.done()}
 }
}

/* ---------- dialogue ---------- */
let speaking=false,dlgTimer=null,dlgSkip=null,lastLineAt=0;
const SPK_COLOR={HEMTON:"#b99cff",NOVA:"#7fe3ff"};
function speak(speaker,lines,done){
 clearTimeout(dlgTimer);
 let i=0;const shown=[];
 speaking=true;
 const finish=()=>{
   clearTimeout(dlgTimer);
   message.style.display="none";
   speaking=false; dlgSkip=null;
   if(done)done();
 };
 const next=()=>{
   clearTimeout(dlgTimer);
   if(i>=lines.length){finish();return}
   shown.push(lines[i]); i++;
   message.innerHTML='<span class="spk" style="color:'+(SPK_COLOR[speaker]||"#fff")+'">'+speaker+'</span>'+shown.join("<br>");
   message.style.display="block";
   lastLineAt=performance.now();
   dlgTimer=setTimeout(next,i>=lines.length?2400:1000+lines[i-1].length*35);
 };
 dlgSkip=()=>{if(performance.now()-lastLineAt>700)next()};
 next();
}

/* ---------- actions ---------- */
function currentAction(){
 if(busy||speaking||!started)return null;
 const p=player.position;
 switch(state){
   case "HEMTON": if(dist2D(p,ship.position)<11)return "TALK TO HEMTON";break;
   case "NOVA": if(dist2D(p,nova.position)<5)return "TALK TO NOVA";break;
   case "WORKBENCH": return "BUILD WORKBENCH";
   case "NEUTRON": if(workbench&&dist2D(p,workbench.position)<4.5)return "BUILD NEUTRON";break;
   case "REPAIR": if(dist2D(p,nova.position)<5)return "USE NEUTRON ON NOVA";break;
   case "FOLLOW": if(dist2D(p,nova.position)<4)return "TALK TO NOVA";break;
 }
 return null;
}

function interact(){
 if(!started)return;
 if(speaking){if(dlgSkip)dlgSkip();return}
 if(busy)return;
 const act=currentAction();
 if(!act){fallbackTalk();return}

 if(state==="HEMTON"){
   setState("NOVA");
   speak("HEMTON",[
     "Critical systems failure detected.",
     "Life support 31%.",
     "Navigation offline.",
     "Communication unavailable...",
     "...and you're finally awake."
   ],()=>speak("HEMTON",["Short-range scan detected a damaged unit nearby.","Designation: NOVA. Follow the signal."]));
 }else if(state==="NOVA"){
   facePlayer();
   setState("GATHER");
   speak("NOVA",["My locomotion system is damaged...","I can't roll like this."],
     ()=>speak("HEMTON",["Repair requires a NEUTRON transfer device.","Salvage Metal, Energy and Components from the crash site."]));
 }else if(state==="WORKBENCH"){
   buildWorkbench();
 }else if(state==="NEUTRON"){
   buildNeutron();
 }else if(state==="REPAIR"){
   startRepair();
 }else if(state==="FOLLOW"){
   facePlayer();
   speak("NOVA",NOVA_HINT.FOLLOW);
 }
}

function fallbackTalk(){
 const p=player.position;
 if(dist2D(p,nova.position)<5&&NOVA_HINT[state]){facePlayer();speak("NOVA",NOVA_HINT[state]);return}
 if(dist2D(p,nova.position)<5){facePlayer();speak("NOVA",["...locomotion... damaged..."]);return}
 if(dist2D(p,ship.position)<11&&HEMTON_HINT[state]){speak("HEMTON",HEMTON_HINT[state]);return}
 toast("Nothing useful here.",1400);
}

/* ---------- waypoint ---------- */
function getWaypoint(){
 switch(state){
   case "HEMTON": return {pos:ship.position,name:"HEMTON",txt:"GO TO THE CRASHED SHIP",css:"#b99cff",col:0xa070ff,lift:7};
   case "NOVA": return {pos:nova.position,name:"NOVA SIGNAL",txt:"FOLLOW THE SIGNAL TO NOVA",css:"#7fe3ff",col:0x6fe0ff,lift:3.5};
   case "GATHER":{
     let best=null,bd=1e9;
     for(const g of pickups){
       if(inv[g.userData.type]>=NEED[g.userData.type])continue;
       const d=dist2D(player.position,g.position);
       if(d<bd){bd=d;best=g}
     }
     const txt="METAL "+Math.min(inv.metal,NEED.metal)+"/"+NEED.metal+" • ENERGY "+Math.min(inv.energy,NEED.energy)+"/"+NEED.energy+" • COMPONENTS "+Math.min(inv.parts,NEED.parts)+"/"+NEED.parts;
     if(!best)return {pos:null,txt,noDist:true};
     const t=best.userData.type;
     return {pos:best.position,name:RES[t].label,txt,noDist:true,css:RES[t].css,col:RES[t].color,lift:1.5};
   }
   case "WORKBENCH": return {pos:null,txt:"FIND OPEN GROUND • PRESS USE TO BUILD",noDist:true};
   case "NEUTRON": return workbench?{pos:workbench.position,name:"WORKBENCH",txt:"GO TO THE WORKBENCH",css:"#b99cff",col:0xa070ff,lift:3}:null;
   case "REPAIR": return {pos:nova.position,name:"NOVA",txt:"BRING THE NEUTRON TO NOVA",css:"#7fe3ff",col:0x6fe0ff,lift:3};
   case "FOLLOW": return {pos:null,txt:"NOVA IS NOW YOUR COMPANION • EXPLORE AURELIS",noDist:true};
 }
 return null;
}

function updateWaypoint(){
 const w=getWaypoint();
 if(!w){wpEl.style.display="none";beamG.visible=false;return}
 if(!w.pos){wpEl.style.display="none";beamG.visible=false;setSub(w.txt);return}

 const d=Math.hypot(w.pos.x-player.position.x,w.pos.z-player.position.z);
 setSub(w.noDist?w.txt:w.txt+" • "+Math.round(d)+"m");

 // 3D beacon
 const gy=terrainHeight(w.pos.x,w.pos.z);
 beamG.position.set(w.pos.x,gy,w.pos.z);
 beamMat.color.setHex(w.col);
 beamG.visible=d>3;

 // screen marker
 const world=new THREE.Vector3(w.pos.x,gy+w.lift,w.pos.z);
 const cam=world.clone().applyMatrix4(camera.matrixWorldInverse);
 const behind=cam.z>0;
 const v=world.clone().project(camera);
 const W=innerWidth,H=innerHeight;
 let sx=(v.x*.5+.5)*W,sy=(-v.y*.5+.5)*H;
 if(behind){sx=W-sx;sy=H-sy}
 const m=46;
 const off=behind||sx<m||sx>W-m||sy<m||sy>H-m;
 let ang=0;
 if(off){
   const cx=W/2,cy=H/2;
   let dx=sx-cx,dy=sy-cy;
   if(Math.abs(dx)<1e-3&&Math.abs(dy)<1e-3)dy=1;
   ang=Math.atan2(dy,dx);
   const k=Math.min((cx-m)/Math.max(Math.abs(dx),1e-3),(cy-m)/Math.max(Math.abs(dy),1e-3));
   sx=cx+dx*k; sy=cy+dy*k;
 }
 wpEl.style.display="block";
 wpEl.style.setProperty("--c",w.css);
 wpEl.style.transform="translate("+sx+"px,"+sy+"px)";
 wpDia.style.display=off?"none":"block";
 wpArr.style.display=off?"block":"none";
 wpArr.style.transform="rotate("+ang+"rad)";
 wpLbl.textContent=w.name+" • "+Math.round(d)+"m";
}

/* ---------- input ---------- */
function setupJoystick(){
 function start(e){
   if(!started || e.pointerType==="mouse")return;
   e.preventDefault();
   joystickActive=true; joyId=e.pointerId;
   joystick.style.left=(e.clientX-66)+"px";
   joystick.style.top=(e.clientY-66)+"px";
   joystick.style.display="block";
   updateJoy(e.clientX,e.clientY);
 }
 function move(e){
   if(!joystickActive || e.pointerId!==joyId)return;
   e.preventDefault(); updateJoy(e.clientX,e.clientY);
 }
 function end(e){
   if(e.pointerId!==joyId)return;
   joystickActive=false; joyId=null; joyX=0; joyY=0;
   stick.style.transform="translate(0,0)";
   joystick.style.display="none";
 }
 joystickZone.addEventListener("pointerdown",start);
 joystickZone.addEventListener("pointermove",move);
 joystickZone.addEventListener("pointerup",end);
 joystickZone.addEventListener("pointercancel",end);

 function updateJoy(x,y){
   const cx=parseFloat(joystick.style.left)+66;
   const cy=parseFloat(joystick.style.top)+66;
   let dx=x-cx,dy=y-cy;
   const max=48;
   const len=Math.hypot(dx,dy);
   if(len>max){dx=dx/len*max;dy=dy/len*max}
   joyX=dx/max;          // right = +X
   joyY=-dy/max;         // up on screen = forward
   stick.style.transform="translate("+dx+"px,"+dy+"px)";
 }
}

function setupLook(){
 lookArea.addEventListener("pointerdown",e=>{
   if(!started || e.pointerType==="mouse")return;
   lookId=e.pointerId;
   lastLookX=e.clientX; lastLookY=e.clientY;
   lookArea.setPointerCapture(e.pointerId);
 });
 lookArea.addEventListener("pointermove",e=>{
   if(e.pointerId!==lookId)return;
   const dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;
   lastLookX=e.clientX; lastLookY=e.clientY;
   yaw-=dx*.006;
   pitch-=dy*.004;
   pitch=THREE.MathUtils.clamp(pitch,-.75,.8);
 });
 lookArea.addEventListener("pointerup",e=>{if(e.pointerId===lookId)lookId=null});
 lookArea.addEventListener("pointercancel",e=>{if(e.pointerId===lookId)lookId=null});
}

function toggleCam(){
 thirdPerson=!thirdPerson;
 toast(thirdPerson?"THIRD-PERSON CAMERA":"FIRST-PERSON CAMERA",1200);
}
function jump(){
 if(!started)return;
 if(grounded){velocityY=7.6;grounded=false}
}

function setupButtons(){
 document.getElementById("play").addEventListener("click",async()=>{
   started=true;
   document.getElementById("start").style.display="none";
   try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}
   try{if(screen.orientation?.lock)await screen.orientation.lock("landscape")}catch(e){}
   toast("AURELIS — SYSTEM ONLINE",2200);
 });
 document.getElementById("camBtn").addEventListener("pointerdown",e=>{e.preventDefault();toggleCam()});
 document.getElementById("useBtn").addEventListener("pointerdown",e=>{e.preventDefault();interact()});
 document.getElementById("jumpBtn").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
}

/* ---------- per-frame updates ---------- */
function updatePlayer(dt){
 let ix=joyX, iz=joyY;
 if(keys.KeyA)ix-=1;
 if(keys.KeyD)ix+=1;
 if(keys.KeyW)iz+=1;
 if(keys.KeyS)iz-=1;

 const len=Math.hypot(ix,iz);
 if(len>1){ix/=len;iz/=len}

 // Camera forward = (-sin yaw, -cos yaw), camera right = (cos yaw, -sin yaw).
 // Same convention for first and third person, so left is left and forward is forward.
 const sin=Math.sin(yaw),cos=Math.cos(yaw);
 const worldX=ix*cos - iz*sin;
 const worldZ=-ix*sin - iz*cos;

 const targetX=worldX*4.5,targetZ=worldZ*4.5;
 const smooth=1-Math.pow(.001,dt);
 velocityX+=(targetX-velocityX)*smooth;
 velocityZ+=(targetZ-velocityZ)*smooth;

 const p=player.position;
 p.x=THREE.MathUtils.clamp(p.x+velocityX*dt,-235,235);
 p.z=THREE.MathUtils.clamp(p.z+velocityZ*dt,-235,235);

 // Gravity and jump (time-based so it works at any frame rate)
 velocityY-=22*dt;
 p.y+=velocityY*dt;
 const gy=terrainHeight(p.x,p.z);
 if(p.y<=gy+.05 && velocityY<=0){
   p.y=gy; velocityY=0; grounded=true;
 }else{
   grounded=false;
 }

 if(!busy && Math.hypot(velocityX,velocityZ)>.15){
   player.rotation.y=Math.atan2(velocityX,velocityZ);
 }
}

function updateCamera(){
 const p=player.position;
 const target=new THREE.Vector3(p.x,p.y+1.55,p.z);
 player.visible=thirdPerson;

 if(thirdPerson){
   const dist=5.5;
   const h=Math.cos(pitch)*dist;
   camera.position.set(
     target.x+Math.sin(yaw)*h,
     target.y+2.2-Math.sin(pitch)*dist,
     target.z+Math.cos(yaw)*h
   );
   const minY=terrainHeight(camera.position.x,camera.position.z)+.5;
   if(camera.position.y<minY)camera.position.y=minY;
   camera.lookAt(target);
 }else{
   camera.position.copy(target);
   camera.rotation.order="YXZ";
   camera.rotation.y=yaw;
   camera.rotation.x=pitch;
 }
 camera.updateMatrixWorld();
}

function updatePickups(dt,t){
 for(let i=pickups.length-1;i>=0;i--){
   const g=pickups[i];
   g.rotation.y+=dt*1.6;
   g.position.y=g.userData.y0+Math.sin(t*2.2+g.userData.ph)*.14;
   if(dist2D(player.position,g.position)<2.1)collect(g);
 }
}

function updateNova(dt,t){
 novaSensor.rotation.y+=dt*(novaMode==="online"?3:(novaMode==="repairing"?6:.7));
 if(novaMode==="damaged"){
   const gy=terrainHeight(nova.position.x,nova.position.z);
   nova.position.y=gy+.52;
   nova.rotation.z=.28+Math.sin(t*6)*.008;
   novaEyeMat.color.setHex((Math.sin(t*23)*Math.sin(t*7)>.55)?0x9d72ff:0x3a2658);
   return;
 }
 if(novaMode!=="online")return;

 const nx=nova.position.x,nz=nova.position.z;
 const dx=player.position.x-nx,dz=player.position.z-nz;
 const d=Math.hypot(dx,dz);
 let step=0;
 if(d>60){ // too far behind, catch up
   nova.position.x=player.position.x+Math.sin(yaw)*3;
   nova.position.z=player.position.z+Math.cos(yaw)*3;
 }else if(d>3.4){
   const speed=Math.min(5.4,(d-3.4)*2.2+1.3);
   step=speed*dt;
   nova.position.x+=dx/d*step;
   nova.position.z+=dz/d*step;
 }
 nova.rotation.y=lerpAngle(nova.rotation.y,Math.atan2(dx,dz),1-Math.pow(.0008,dt));
 nova.rotation.z*=Math.pow(.001,dt); // settle upright
 novaBall.rotation.x+=step/.65;
 const bob=step>0?0:Math.sin(t*3)*.035;
 nova.position.y=terrainHeight(nova.position.x,nova.position.z)+.65+bob;
 novaEyeMat.color.setHex(0x9d72ff);
}

function updatePrompt(){
 const a=currentAction();
 if(a){
   const txt="USE • "+a;
   if(promptEl.textContent!==txt)promptEl.textContent=txt;
   promptEl.style.display="block";
 }else{
   promptEl.style.display="none";
 }
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 const t=performance.now()*.001;
 if(started){
   updatePlayer(dt);
   updateTweens(dt);
   updatePickups(dt,t);
   updateNova(dt,t);
   updateCamera();
   // beacon pulse
   if(beamG.visible){
     beamMat.opacity=.22+Math.sin(t*3)*.08;
     const ring=beamG.getObjectByName("ring");
     ring.scale.setScalar(1+((t*.8)%1)*.5);
   }
   updateWaypoint();
   updatePrompt();
 }
 renderer.render(scene,camera);
}

loading.textContent="Loading AURELIS...";
setup();
</script>
