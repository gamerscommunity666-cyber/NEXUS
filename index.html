<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050309">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEXUS — AURELIS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050309;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#game{position:fixed;inset:0;overflow:hidden}
#rotate{position:fixed;inset:0;z-index:100;background:#08050d;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}
#rotate div{font-size:22px;font-weight:bold;line-height:1.5}
#rotate span{display:block;font-size:50px;margin-bottom:15px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#objective{position:absolute;top:18px;left:18px;padding:10px 15px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(5,3,9,.58);backdrop-filter:blur(8px);font-size:13px;letter-spacing:1px}
#objective b{display:block;color:#b99cff;font-size:10px;margin-bottom:4px}
#status{position:absolute;left:18px;bottom:18px;font-size:11px;color:#d9d0e8;background:rgba(5,3,9,.5);padding:7px 10px;border-radius:8px}
#message{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);width:min(620px,82vw);padding:15px 18px;border-radius:12px;border:1px solid rgba(180,140,255,.4);background:rgba(8,5,15,.84);backdrop-filter:blur(10px);font-size:14px;line-height:1.5;display:none;text-align:center}
#controls{position:fixed;inset:0;z-index:20;pointer-events:none}
#lookArea{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}
#joystickZone{position:absolute;left:0;bottom:0;width:48%;height:72%;pointer-events:auto}
#joystick{position:absolute;width:132px;height:132px;border-radius:50%;display:none;pointer-events:none;border:2px solid rgba(210,180,255,.32);background:rgba(90,55,120,.14);box-shadow:0 0 25px rgba(130,80,220,.12)}
#stick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(210,185,255,.42);border:2px solid rgba(255,255,255,.5);box-shadow:0 5px 20px rgba(0,0,0,.35)}
.btn{position:absolute;pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(18,12,28,.55);color:#fff;border-radius:50%;font-size:11px;font-weight:bold;backdrop-filter:blur(8px);width:62px;height:62px}
.btn:active{transform:scale(.94);background:rgba(120,75,170,.55)}
#useBtn{right:26px;bottom:29%;width:70px;height:70px}
#jumpBtn{right:105px;bottom:17%;width:58px;height:58px}
#camBtn{right:25px;bottom:13%;width:58px;height:58px}
#hint{position:absolute;right:25px;top:18px;font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.7px}
#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#29143b 0,#09060e 48%,#020205 100%)}
#startPanel{text-align:center;width:min(560px,88vw);padding:28px}
#startPanel h1{font-size:clamp(42px,10vw,76px);letter-spacing:10px;margin:0 0 6px}
#startPanel p{color:#aaa1b8;letter-spacing:2px;margin:0 0 28px}
#play{border:1px solid #b88aff;background:rgba(130,75,190,.18);color:white;padding:15px 42px;border-radius:12px;font-weight:bold;letter-spacing:3px;font-size:14px}
#play:active{transform:scale(.97)}
#loading{margin-top:16px;font-size:11px;color:#756b80}
@media (orientation:portrait){
 #rotate{display:flex}
 #start{display:none}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="rotate"><div><span>ROTATE</span>Please rotate your phone to<br><b>LANDSCAPE</b> to play NEXUS.</div></div>

<div id="start">
  <div id="startPanel">
    <h1>NEXUS</h1>
    <p>AURELIS • CHAPTER 1</p>
    <button id="play">PLAY NEXUS</button>
    <div id="loading">Initializing exploration system...</div>
  </div>
</div>

<div id="hud">
  <div id="objective"><b>OBJECTIVE</b><span id="objectiveText">TALK TO UNKNOWN</span></div>
  <div id="status">AURELIS • CRASH SITE</div>
  <div id="message"></div>
</div>

<div id="controls">
  <div id="lookArea"></div>
  <div id="joystickZone"></div>
  <div id="joystick"><div id="stick"></div></div>
  <button class="btn" id="useBtn">USE</button>
  <button class="btn" id="jumpBtn">JUMP</button>
  <button class="btn" id="camBtn">CAM</button>
  <div id="hint">SWIPE RIGHT SIDE TO LOOK</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

let scene,camera,renderer,clock;
let player,ship,nova,terrain;
let started=false,thirdPerson=false;
let yaw=0,pitch=0.18;
let velocityX=0,velocityZ=0;
let joystickActive=false,joyId=null;
let joyX=0,joyY=0;
let lookId=null,lastLookX=0,lastLookY=0;
let interacted=false;
const keys={};

const game=document.getElementById("game");
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const joystickZone=document.getElementById("joystickZone");
const lookArea=document.getElementById("lookArea");
const message=document.getElementById("message");
const objectiveText=document.getElementById("objectiveText");
const loading=document.getElementById("loading");

function makeMat(color,rough=1,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}

function createTerrain(){
 const geo=new THREE.PlaneGeometry(500,500,80,80);
 const p=geo.attributes.position;
 for(let i=0;i<p.count;i++){
   const x=p.getX(i),z=p.getY(i);
   let h=Math.sin(x*.055)*2.5+Math.cos(z*.047)*2.2+Math.sin((x+z)*.025)*3;
   h+=Math.max(0,Math.sin(x*.015)*Math.cos(z*.021))*3;
   p.setZ(i,h);
 }
 geo.computeVertexNormals();
 terrain=new THREE.Mesh(geo,makeMat(0x673927,1,0));
 terrain.rotation.x=-Math.PI/2;
 terrain.name='AURELIS_TERRAIN';
 scene.add(terrain);

 const rockMat=makeMat(0x43241e,1,0);
 for(let i=0;i<55;i++){
   const r=new THREE.Mesh(new THREE.DodecahedronGeometry(THREE.MathUtils.randFloat(2,8),1),rockMat);
   r.position.set((Math.random()-.5)*440,THREE.MathUtils.randFloat(2,7),(Math.random()-.5)*440);
   r.scale.y=THREE.MathUtils.randFloat(.6,1.8);
   r.rotation.set(Math.random()*2,Math.random()*3,Math.random()*2);
   scene.add(r);
 }
}

function createPlayer(){
 player=new THREE.Group();
 const suit=makeMat(0x292832,.8,.25);
 const white=makeMat(0xd7d7dc,.55,.35);
 const visor=makeMat(0x170d24,.2,.75);

 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,8,16),suit);
 body.position.y=1.35; player.add(body);
 const chest=new THREE.Mesh(new THREE.BoxGeometry(.72,.65,.3),white);
 chest.position.set(0,1.5,.05); player.add(chest);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),makeMat(0xb77b60,.8,0));
 head.position.y=2.25; player.add(head);
 const visorM=new THREE.Mesh(new THREE.SphereGeometry(.25,16,10),visor);
 visorM.scale.set(1,.65,.35); visorM.position.set(0,2.27,.29); player.add(visorM);

 for(const s of [-1,1]){
   const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.75,6,10),suit);
   leg.position.set(s*.19,.65,0); player.add(leg);
   const boot=new THREE.Mesh(new THREE.BoxGeometry(.27,.18,.45),makeMat(0x111116,.7,.5));
   boot.position.set(s*.19,.18,.07); player.add(boot);
   const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.65,6,10),suit);
   arm.rotation.z=s*.13; arm.position.set(s*.56,1.48,0); player.add(arm);
 }
 player.position.set(0,0,6);
 scene.add(player);
}

function createShip(){
 ship=new THREE.Group();
 const hull=makeMat(0x77757a,.6,.75);
 const dark=makeMat(0x1d1d22,.5,.65);
 const broken=makeMat(0x33252a,.9,.1);

 const main=new THREE.Mesh(new THREE.CylinderGeometry(2.8,3.5,7,16),hull);
 main.rotation.z=Math.PI/2; main.rotation.y=.15; main.position.y=2.6; ship.add(main);
 const nose=new THREE.Mesh(new THREE.ConeGeometry(2.8,4,16),dark);
 nose.rotation.z=-Math.PI/2; nose.position.set(4.5,2.6,0); ship.add(nose);

 for(let i=0;i<3;i++){
   const wing=new THREE.Mesh(new THREE.BoxGeometry(3.2,.35,1.7),broken);
   wing.position.set(-.7,.9,(i-1)*2.1);
   wing.rotation.z=(i-1)*.1; ship.add(wing);
 }
 const glow=new THREE.Mesh(new THREE.SphereGeometry(.35,12,8),new THREE.MeshBasicMaterial({color:0x9c65ff}));
 glow.position.set(1.8,2.7,.9); ship.add(glow);
 ship.position.set(0,0,-5);
 ship.rotation.y=-.25;
 scene.add(ship);
}

function createNova(){
 nova=new THREE.Group();
 const body=new THREE.Mesh(new THREE.SphereGeometry(.65,20,14),makeMat(0x52545d,.45,.7));
 nova.add(body);
 const eye=new THREE.Mesh(new THREE.SphereGeometry(.2,16,10),new THREE.MeshBasicMaterial({color:0x9d72ff}));
 eye.position.set(0,.15,.58); nova.add(eye);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.46,.035,8,24),makeMat(0xa9a4b5,.4,.7));
 ring.rotation.x=Math.PI/2; nova.add(ring);
 const antenna=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.45,8),makeMat(0xb5b5bc,.4,.7));
 antenna.position.y=.7; nova.add(antenna);
 nova.position.set(2.4,.72,-3.4);
 scene.add(nova);
}

function createStars(){
 const geo=new THREE.BufferGeometry();
 const arr=[];
 for(let i=0;i<1500;i++){
   arr.push((Math.random()-.5)*600,Math.random()*220+15,(Math.random()-.5)*600);
 }
 geo.setAttribute("position",new THREE.Float32BufferAttribute(arr,3));
 scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.65,sizeAttenuation:true})));
}

function setup(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x100811);
 scene.fog=new THREE.FogExp2(0x210f18,.006);

 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,700);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 game.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xffd7bd,0x160b18,1.5));
 const sun=new THREE.DirectionalLight(0xffc39a,2.1);
 sun.position.set(-60,100,40); scene.add(sun);

 createTerrain();
 createStars();
 createShip();
 createPlayer();
 createNova();

 window.addEventListener("resize",resize);
 window.addEventListener("keydown",e=>keys[e.code]=true);
 window.addEventListener("keyup",e=>keys[e.code]=false);

 setupJoystick();
 setupLook();
 setupButtons();
 animate();
}

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

function showMessage(text,time=3500){
 message.textContent=text;
 message.style.display="block";
 clearTimeout(showMessage.t);
 showMessage.t=setTimeout(()=>message.style.display="none",time);
}

function setupJoystick(){
 function start(e){
   if(!started || e.pointerType==="mouse")return;
   e.preventDefault();
   joystickActive=true; joyId=e.pointerId;
   const r=joystickZone.getBoundingClientRect();
   const x=e.clientX-r.left,y=e.clientY-r.top;
   joystick.style.left=(e.clientX-66)+"px";
   joystick.style.top=(e.clientY-66)+"px";
   joystick.style.display="block";
   updateJoy(e.clientX,e.clientY);
 }
 function move(e){
   if(!joystickActive || e.pointerId!==joyId)return;
   e.preventDefault(); updateJoy(e.clientX,e.clientY);
 }
 function end(e){
   if(e.pointerId!==joyId)return;
   joystickActive=false; joyId=null; joyX=0; joyY=0;
   stick.style.transform="translate(0,0)";
   joystick.style.display="none";
 }
 joystickZone.addEventListener("pointerdown",start);
 joystickZone.addEventListener("pointermove",move);
 joystickZone.addEventListener("pointerup",end);
 joystickZone.addEventListener("pointercancel",end);

 function updateJoy(x,y){
   const cx=parseFloat(joystick.style.left)+66;
   const cy=parseFloat(joystick.style.top)+66;
   let dx=x-cx,dy=y-cy;
   const max=48;
   const len=Math.hypot(dx,dy);
   if(len>max){dx=dx/len*max;dy=dy/len*max}
   joyX=dx/max;
   // CORRECTED: screen Y down means game forward is negative Z.
   joyY=-dy/max;
   stick.style.transform=`translate(${dx}px,${dy}px)`;
 }
}

function setupLook(){
 lookArea.addEventListener("pointerdown",e=>{
   if(!started || e.pointerType==="mouse")return;
   lookId=e.pointerId;
   lastLookX=e.clientX; lastLookY=e.clientY;
   lookArea.setPointerCapture(e.pointerId);
 });
 lookArea.addEventListener("pointermove",e=>{
   if(e.pointerId!==lookId)return;
   const dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;
   lastLookX=e.clientX; lastLookY=e.clientY;
   yaw-=dx*.006;
   pitch-=dy*.004;
   pitch=THREE.MathUtils.clamp(pitch,-.75,.8);
 });
 lookArea.addEventListener("pointerup",e=>{if(e.pointerId===lookId)lookId=null});
 lookArea.addEventListener("pointercancel",e=>{if(e.pointerId===lookId)lookId=null});
}

function setupButtons(){
 document.getElementById("play").addEventListener("click",async()=>{
   started=true;
   document.getElementById("start").style.display="none";
   try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}
   try{if(screen.orientation?.lock)await screen.orientation.lock("landscape")}catch(e){}
   showMessage("AURELIS — SYSTEM ONLINE",2200);
 });

 document.getElementById("camBtn").addEventListener("pointerdown",e=>{
   e.preventDefault(); thirdPerson=!thirdPerson;
   showMessage(thirdPerson?"THIRD-PERSON CAMERA":"FIRST-PERSON CAMERA",1200);
 });

 document.getElementById("useBtn").addEventListener("pointerdown",e=>{
   e.preventDefault(); interact();
 });

 document.getElementById("jumpBtn").addEventListener("pointerdown",e=>{
   e.preventDefault();
   if(player.position.y<.05) velocityY=.16;
 });
}

let velocityY=0;

function interact(){
 if(!started)return;
 const d=player.position.distanceTo(ship.position);
 if(d<9 && !interacted){
   interacted=true;
   objectiveText.textContent="SYSTEM MESSAGE";
   showMessage("HEMTON: Critical systems failure detected. Life support 31%. Navigation offline. Communication unavailable... and you're finally awake.",7000);
 }else if(player.position.distanceTo(nova.position)<4){
   showMessage("NOVA: My locomotion system is damaged... I can't roll like this.",4000);
 }else{
   showMessage("Nothing useful here.",1400);
 }
}

function updatePlayer(dt){
 let ix=joyX, iz=joyY;
 if(keys.KeyA)ix-=1;
 if(keys.KeyD)ix+=1;
 if(keys.KeyW)iz+=1;
 if(keys.KeyS)iz-=1;

 const len=Math.hypot(ix,iz);
 if(len>1){ix/=len;iz/=len}

 // Movement is relative to the camera yaw.
 const sin=Math.sin(yaw),cos=Math.cos(yaw);
 const worldX=ix*cos + iz*sin;
 const worldZ=-ix*sin + iz*cos;

 const targetX=worldX*4.5,targetZ=worldZ*4.5;
 const smooth=1-Math.pow(.001,dt);
 velocityX+=(targetX-velocityX)*smooth;
 velocityZ+=(targetZ-velocityZ)*smooth;

 player.position.x+=velocityX*dt;
 player.position.z+=velocityZ*dt;

 // Gravity / jump.
 velocityY-=.42;
 player.position.y+=velocityY;

 // Keep the character standing ON the actual AURELIS terrain.
 // A downward ray finds the deformed ground instead of assuming y = 0.
 const rayOriginY=Math.max(player.position.y+30,30);
 const ray=new THREE.Raycaster(
   new THREE.Vector3(player.position.x,rayOriginY,player.position.z),
   new THREE.Vector3(0,-1,0),
   0,80
 );
 const hit=ray.intersectObject(terrain,false)[0];

 if(hit){
   const groundY=hit.point.y;
   const feetClearance=0.03;
   if(player.position.y<=groundY+feetClearance && velocityY<=0){
     player.position.y=groundY+feetClearance;
     velocityY=0;
   }
 }else if(player.position.y<0){
   player.position.y=0;
   velocityY=0;
 }

 if(Math.hypot(velocityX,velocityZ)>.15){
   player.rotation.y=Math.atan2(velocityX,velocityZ);
 }
}

function updateCamera(){
 const target=new THREE.Vector3(player.position.x,player.position.y+1.55,player.position.z);

 if(thirdPerson){
   const dist=5.5;
   const h=Math.cos(pitch)*dist;
   camera.position.set(
     target.x-Math.sin(yaw)*h,
     target.y+Math.sin(pitch)*dist+1,
     target.z-Math.cos(yaw)*h
   );
   camera.lookAt(target);
 }else{
   camera.position.copy(target);
   camera.rotation.order="YXZ";
   camera.rotation.y=yaw;
   camera.rotation.x=pitch;
 }
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(started){
   updatePlayer(dt);
   updateCamera();
   nova.rotation.y+=dt*1.5;
   nova.position.y=.72+Math.sin(performance.now()*.003)*.06;
 }
 renderer.render(scene,camera);
}

loading.textContent="Loading AURELIS...";
setup();
</script>
</body>
</html>
