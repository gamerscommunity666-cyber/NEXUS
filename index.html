<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050309;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}

#controls{position:fixed;inset:0;z-index:20;pointer-events:none}

#joystickZone{position:absolute;left:0;bottom:0;width:48%;height:72%;pointer-events:auto}
#joystick{position:absolute;width:132px;height:132px;border-radius:50%;display:none;pointer-events:none;border:2px solid rgba(210,180,255,.32);background:rgba(90,55,120,.14);box-shadow:0 0 25px rgba(130,80,220,.12)}
#stick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(210,185,255,.42);border:2px solid rgba(255,255,255,.5);box-shadow:0 5px 20px rgba(0,0,0,.35)}
.btn{position:absolute;pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(18,12,28,.55);color:#fff;border-radius:50%;font-size:11px;font-weight:bold;backdrop-filter:blur(8px);width:62px;height:62px;touch-action:none}

#useBtn{right:26px;bottom:29%;width:70px;height:70px}
#jumpBtn{right:105px;bottom:17%;width:58px;height:58px}

#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#29143b 0,#09060e 48%,#020205 100%)}
#startPanel{text-align:center;width:min(560px,88vw);padding:28px}

@media (orientation:portrait){
 #rotate{display:flex}

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* ============================================================
   NEXUS V0.5 — AURELIS — Chapter 1 opening sequence
   Realistic look, enterable crashed ship, astronaut suit

let scene,camera,renderer,clock;
let player,ship,nova,terrain;
let novaBall,novaSensor,novaEyeMat;
let workbench=null,neutronDevice=null;
let beamG,beamMat,linkBeam;
let sun,sky,dust,dustPos;
let started=false,thirdPerson=false;
let yaw=0,pitch=0.18;
let velocityX=0,velocityZ=0,velocityY=0,grounded=true;

let lookId=null,lastLookX=0,lastLookY=0;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const joystickZone=document.getElementById("joystickZone");

const message=document.getElementById("message");

const objectiveSub=document.getElementById("objectiveSub");

const wpArr=wpEl.querySelector(".arr");

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(20260);
const rr=(a,b)=>a+(b-a)*rand();
function makeMat(color,rough=1,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
function glowMat(color,opacity=.2){
 return new THREE.MeshBasicMaterial({color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
}
const glow=c=>new THREE.MeshBasicMaterial({color:c,toneMapped:false});
function lerpAngle(a,b,k){
 const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
 return a+d*k;
}
const dist2D=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const smoothstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

/* ---------- world layout ---------- */
const NOVA_SPOT={x:-17,z:-24};
const SHIP_SPOT={x:0,z:-5};
const SHIP_YAW=-.25;
const SHIP_FY=.2;            // interior floor height above ship origin

/* Ground height. Raw terrain, flattened into a pad around the crash site so the ship sits level. */
function rawH(wx,wz){
 const x=wx,z=-wz;
 let h=Math.sin(x*.055)*2.5+Math.cos(z*.047)*2.2+Math.sin((x+z)*.025)*3;
 h+=Math.max(0,Math.sin(x*.015)*Math.cos(z*.021))*3;
 h+=Math.sin(x*.31+z*.17)*Math.cos(z*.29-x*.11)*.3;
 return h;
}
const PAD_Y=rawH(SHIP_SPOT.x,SHIP_SPOT.z)-.05;
const PAD_IN=9,PAD_OUT=18;
function terrainHeight(wx,wz){
 let h=rawH(wx,wz);
 const d=Math.hypot(wx-SHIP_SPOT.x,wz-SHIP_SPOT.z);
 if(d<PAD_OUT){const t=smoothstep(PAD_OUT,PAD_IN,d);h=h*(1-t)+PAD_Y*t}
 return h;
}
const SHIP_FLOOR_Y=PAD_Y+SHIP_FY;

/* ---------- story data ---------- */
const RES={
 metal:{label:"METAL",color:0xc9d2e8,css:"#c9d2e8"},
 energy:{label:"ENERGY",color:0xb066ff,css:"#b066ff"},
 parts:{label:"COMPONENTS",color:0x35e0ff,css:"#35e0ff"}
};
const NEED={metal:5,energy:3,parts:3};        // total needed (workbench + NEUTRON)
const WB_COST={metal:3,parts:1};
const NEUT_COST={metal:2,energy:3,parts:2};
const inv={metal:0,energy:0,parts:0};
let neutronBuilt=false;

const ORDER=["HEMTON","NOVA","GATHER","WORKBENCH","NEUTRON","REPAIR","FOLLOW"];
const OBJ={
 HEMTON:"TALK TO HEMTON",NOVA:"FIND NOVA",GATHER:"GATHER RESOURCES",
 WORKBENCH:"BUILD WORKBENCH",NEUTRON:"BUILD NEUTRON",REPAIR:"REPAIR NOVA",FOLLOW:"FOLLOW NOVA"
};
let state="HEMTON";
let novaMode="damaged"; // damaged | repairing | online
let busy=false;

const HEMTON_HINT={
 HEMTON:["Systems are unstable. Approach the console."],
 NOVA:["Auxiliary unit NOVA detected nearby.","Follow the signal."],
 GATHER:["Salvage Metal, Energy and Components from the crash site."],
 WORKBENCH:["Build a workbench on open ground, away from the wreckage."],
 NEUTRON:["Fabricate the NEUTRON at your workbench."],
 REPAIR:["Bring the NEUTRON to NOVA."],
 FOLLOW:["NOVA is online. Resume survey of AURELIS."]
};
const NOVA_HINT={
 GATHER:["Salvage Metal, Energy and Components.","Pieces of the wreck are scattered all around."],
 WORKBENCH:["Find some open ground and build a workbench."],
 NEUTRON:["The NEUTRON has to be built at the workbench."],
 REPAIR:["I am ready. Bring the NEUTRON close."],
 FOLLOW:["Systems nominal. Lead the way."]
};

/* ============================================================
   PROCEDURAL TEXTURES
   ============================================================ */
const TEX={};
function mkCanvas(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return [c,c.getContext("2d")]}
function canvasTex(c,repeat){
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 t.wrapS=t.wrapT=THREE.RepeatWrapping;
 if(repeat)t.repeat.set(repeat,repeat);
 t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
 return t;
}
// tileable value noise
function hash2(ix,iy,P,seed){
 ix=((ix%P)+P)%P; iy=((iy%P)+P)%P;
 let h=Math.imul(ix,374761393)^Math.imul(iy,668265263)^Math.imul(seed,1442695041);
 h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16;
 return (h>>>0)/4294967296;
}
function vnoise(x,y,P,seed){
 const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
 const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 const a=hash2(x0,y0,P,seed),b=hash2(x0+1,y0,P,seed),c=hash2(x0,y0+1,P,seed),d=hash2(x0+1,y0+1,P,seed);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,P,oct,seed){
 let s=0,a=.5,f=1,tot=0;
 for(let o=0;o<oct;o++){s+=a*vnoise(x*f,y*f,P*f,seed+o);tot+=a;a*=.5;f*=2}
 return s/tot;
}

function makeGroundTexture(){
 const S=256,[c,g]=mkCanvas(S,S),im=g.createImageData(S,S);
 for(let y=0;y<S;y++)for(let x=0;x<S;x++){
   const u=x/S*4,v=y/S*4;
   const n=fbm(u,v,4,5,11);
   const m=fbm(u*2,v*2,8,3,41);
   const f=vnoise(x/S*64,y/S*64,64,5);
   const t=smoothstep(.3,.7,n);
   let r=118+(176-118)*t,gg=66+(104-66)*t,b=44+(62-44)*t;
   const k=.82+m*.34;
   r*=k;gg*=k;b*=k;
   if(f>.76){r*=.7;gg*=.7;b*=.72}
   if(f<.12){r*=1.12;gg*=1.1;b*=1.05}
   const i=(y*S+x)*4;
   im.data[i]=Math.min(255,r);im.data[i+1]=Math.min(255,gg);im.data[i+2]=Math.min(255,b);im.data[i+3]=255;
 }
 g.putImageData(im,0,0);
 return canvasTex(c);
}
function makePanelTexture(base,seam){
 const [c,g]=mkCanvas(256,256);
 g.fillStyle=base;g.fillRect(0,0,256,256);
 for(let i=0;i<6;i++){g.fillStyle="rgba(255,255,255,"+(.02+rand()*.05)+")";g.fillRect(rand()*200,rand()*200,30+rand()*70,30+rand()*70)}
 for(let i=0;i<5;i++){g.fillStyle="rgba(0,0,0,"+(.04+rand()*.08)+")";g.fillRect(rand()*200,rand()*200,30+rand()*70,30+rand()*70)}
 g.strokeStyle=seam;g.lineWidth=3;g.strokeRect(1.5,1.5,253,253);
 g.lineWidth=2;g.beginPath();g.moveTo(128,0);g.lineTo(128,256);g.moveTo(0,172);g.lineTo(256,172);g.stroke();
 for(const [x,y] of [[10,10],[246,10],[10,246],[246,246],[118,10],[138,10],[118,246],[138,246]]){
   g.fillStyle="rgba(0,0,0,.5)";g.beginPath();g.arc(x,y,2.6,0,7);g.fill();
   g.fillStyle="rgba(255,255,255,.18)";g.beginPath();g.arc(x-.8,y-.8,1.2,0,7);g.fill();
 }
 for(let i=0;i<12;i++){
   const x=rand()*256,gr=g.createLinearGradient(0,0,0,256);
   gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(12,6,6,"+(.15+rand()*.2)+")");
   g.fillStyle=gr;g.fillRect(x,0,3+rand()*8,256);
 }
 for(let i=0;i<600;i++){g.fillStyle=rand()<.5?"rgba(255,255,255,.05)":"rgba(0,0,0,.09)";g.fillRect(rand()*256,rand()*256,2,2)}
 return canvasTex(c);
}
function makeFloorTexture(){
 const [c,g]=mkCanvas(256,256);
 g.fillStyle="#262930";g.fillRect(0,0,256,256);
 for(let ty=0;ty<4;ty++)for(let tx=0;tx<4;tx++){
   const x=tx*64,y=ty*64;
   g.fillStyle="rgba(255,255,255,"+(.015+rand()*.04)+")";g.fillRect(x,y,64,64);
   for(let k=0;k<4;k++)for(let j=0;j<4;j++){
     g.save();g.translate(x+8+k*16,y+8+j*16);g.rotate(((k+j)%2?1:-1)*.7);
     g.fillStyle="rgba(255,255,255,.09)";g.fillRect(-5,-1.4,10,2.8);g.restore();
   }
   g.strokeStyle="rgba(0,0,0,.7)";g.lineWidth=2;g.strokeRect(x+1,y+1,62,62);
 }
 for(let i=0;i<250;i++){g.fillStyle="rgba(0,0,0,.12)";g.fillRect(rand()*256,rand()*256,3,1.5)}
 return canvasTex(c);
}
function makeHazardTexture(){
 const [c,g]=mkCanvas(128,64);
 g.fillStyle="#1a1a1a";g.fillRect(0,0,128,64);
 g.fillStyle="#d8a81e";
 for(let i=-4;i<10;i++){g.beginPath();g.moveTo(i*20,0);g.lineTo(i*20+10,0);g.lineTo(i*20-14,64);g.lineTo(i*20-24,64);g.closePath();g.fill()}
 const t=canvasTex(c);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}
function makeScorchTexture(){
 const [c,g]=mkCanvas(128,128);
 const gr=g.createRadialGradient(64,64,4,64,64,62);
 gr.addColorStop(0,"rgba(8,5,5,.85)");gr.addColorStop(.55,"rgba(8,5,5,.5)");gr.addColorStop(1,"rgba(8,5,5,0)");
 g.fillStyle=gr;g.fillRect(0,0,128,128);
 for(let i=0;i<14;i++){g.fillStyle="rgba(5,3,3,"+(.1+rand()*.2)+")";g.beginPath();g.arc(30+rand()*68,30+rand()*68,3+rand()*10,0,7);g.fill()}
 const t=canvasTex(c);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}
function makeSmokeTexture(){
 const [c,g]=mkCanvas(64,64);
 const gr=g.createRadialGradient(32,32,2,32,32,31);
 gr.addColorStop(0,"rgba(120,110,120,.9)");gr.addColorStop(1,"rgba(120,110,120,0)");
 g.fillStyle=gr;g.fillRect(0,0,64,64);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeScreen(kind,color){
 const W=256,H=160,[c,g]=mkCanvas(W,H);
 g.fillStyle="#04050c";g.fillRect(0,0,W,H);
 g.strokeStyle=color;g.fillStyle=color;g.lineWidth=2;
 g.globalAlpha=.9;g.strokeRect(4,4,W-8,H-8);
 if(kind==="data"){
   g.fillRect(12,12,70,10);
   for(let i=0;i<9;i++){g.globalAlpha=.35+rand()*.5;g.fillRect(12,32+i*13,20+rand()*(W-60),6)}
 }else if(kind==="radar"){
   g.globalAlpha=.8;
   for(let r=18;r<75;r+=19){g.beginPath();g.arc(W/2,H/2,r,0,7);g.stroke()}
   g.beginPath();g.moveTo(W/2-80,H/2);g.lineTo(W/2+80,H/2);g.moveTo(W/2,H/2-70);g.lineTo(W/2,H/2+70);g.stroke();
   const gr=g.createRadialGradient(W/2,H/2,0,W/2,H/2,75);gr.addColorStop(0,color);gr.addColorStop(1,"rgba(0,0,0,0)");
   g.globalAlpha=.35;g.fillStyle=gr;g.beginPath();g.moveTo(W/2,H/2);g.arc(W/2,H/2,75,-1.2,-.1);g.fill();
   g.globalAlpha=1;g.fillStyle=color;
   for(let i=0;i<5;i++){g.beginPath();g.arc(W/2+(rand()-.5)*120,H/2+(rand()-.5)*100,3,0,7);g.fill()}
 }else if(kind==="wave"){
   for(let k=0;k<3;k++){
     g.globalAlpha=.9-k*.22;g.beginPath();
     for(let x=8;x<W-8;x+=3){const y=H/2+Math.sin(x*(.05+k*.03)+k*2)*(18+k*8)*(.6+.4*Math.sin(x*.02));x===8?g.moveTo(x,y):g.lineTo(x,y)}
     g.stroke();
   }
 }else if(kind==="hemton"){
   g.globalAlpha=.9;

const solids=[]; // circle colliders in world space {x,z,r}

function rockGeo(size){
 const g=new THREE.IcosahedronGeometry(size,2);
 const p=g.attributes.position,col=[];
 const lo=new THREE.Color(0x4f2c20),hi=new THREE.Color(0x805036),tmp=new THREE.Color();
 for(let i=0;i<p.count;i++){
   const x=p.getX(i),y=p.getY(i),z=p.getZ(i),s=1/size;
   const q=(Math.sin(x*s*2.1+y*s*.7)+Math.sin(y*s*2.4+z*s*1.1)+Math.sin(z*s*2.0+x*s*.9))/3;
   const ridge=Math.abs(Math.sin((x+z)*s*3.1))*.08;
   const r=1+q*.3+ridge;
   p.setXYZ(i,x*r,y*r,z*r);
   const t=.5+.5*Math.sin(y*s*4.2+q*2);
   tmp.copy(lo).lerp(hi,t*.85+.15*(y*s>0?1:0));
   col.push(tmp.r,tmp.g,tmp.b);
 }
 g.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
 return g;
}
function createTerrain(){
 const geo=new THREE.PlaneGeometry(500,500,160,160);
 const p=geo.attributes.position;
 for(let i=0;i<p.count;i++){
   p.setZ(i,terrainHeight(p.getX(i),-p.getY(i)));
 }
 geo.computeVertexNormals();
 // vertex colour: dust vs rock by slope, large-scale variation, crash trail
 const nrm=geo.attributes.normal,colors=new Float32Array(p.count*3);
 const dustC=new THREE.Color(1,.93,.85),rockC=new THREE.Color(.52,.36,.3),c=new THREE.Color();
 const cy=Math.cos(SHIP_YAW),sy=Math.sin(SHIP_YAW);
 for(let i=0;i<p.count;i++){
   const wx=p.getX(i),wz=-p.getY(i);
   const slope=Math.min(1,Math.max(0,(1-nrm.getZ(i))*5.5));
   const n=vnoise(wx*.021+50,wz*.021+50,100000,7);
   const n2=vnoise(wx*.07+90,wz*.07+10,100000,9);
   c.copy(dustC).lerp(rockC,slope);
   c.multiplyScalar(.72+n*.5+n2*.15);
   // scorched furrow behind the ship
   const dx=wx-SHIP_SPOT.x,dz=wz-SHIP_SPOT.z;
   const lx=dx*cy-dz*sy,lz=dx*sy+dz*cy;
   if(lx<-4&&lx>-40){
     const w=1-smoothstep(1.5,5.5,Math.abs(lz));
     const f=w*smoothstep(-4,-9,lx)*(1-smoothstep(-28,-40,lx));
     c.multiplyScalar(1-f*.62);
   }
   colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
 }
 geo.setAttribute("color",new THREE.BufferAttribute(colors,3));
 terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:TEX.ground,vertexColors:true,roughness:1,metalness:0,bumpMap:TEX.ground,bumpScale:.9}));
 terrain.rotation.x=-Math.PI/2;
 terrain.name="AURELIS_TERRAIN";
 terrain.receiveShadow=true;
 scene.add(terrain);

 const rockMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0,flatShading:true});
 function addRock(x,z,size,sy=1){
   const r=new THREE.Mesh(rockGeo(size),rockMat);
   r.position.set(x,terrainHeight(x,z)+size*.35*sy,z);

   scene.add(r);
   if(size>=1.5)solids.push({x,z,r:size*.82});
 }
 let placed=0,tries=0;
 while(placed<46&&tries<400){
   tries++;
   const x=(rand()-.5)*440,z=(rand()-.5)*440;
   if(Math.hypot(x,z)<48)continue;
   addRock(x,z,rr(2.5,8),rr(.8,1.9));
   placed++;
 }
 for(let i=0;i<18;i++){
   const a=rand()*Math.PI*2,r=rr(20,46);
   const x=Math.cos(a)*r,z=-5+Math.sin(a)*r;
   if(Math.hypot(x-NOVA_SPOT.x,z-NOVA_SPOT.z)<9)continue;
   addRock(x,z,rr(.7,1.8),rr(.7,1.3));
 }
 addRock(NOVA_SPOT.x-6,NOVA_SPOT.z-2,3.4,1.5);
 addRock(NOVA_SPOT.x+5,NOVA_SPOT.z-5,2.8,1.3);
 addRock(NOVA_SPOT.x-1,NOVA_SPOT.z-8,4.4,1.6);

 // distant mountains ringing the plain
 const mtMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0,flatShading:true});
 for(let i=0;i<30;i++){
   const a=i/30*Math.PI*2+rr(-.07,.07),d=rr(285,360),h=rr(45,125),rad=rr(45,85);
   const g=new THREE.ConeGeometry(rad,h,7,5);
   const mp=g.attributes.position,col=[];
   const base=new THREE.Color(0x4a2630),peak=new THREE.Color(0x8d5f64),t2=new THREE.Color();
   for(let k=0;k<mp.count;k++){
     const x=mp.getX(k),y=mp.getY(k),z=mp.getZ(k);
     const j=1+(Math.sin(x*.21+z*.17+i)*.22+Math.sin(z*.31-y*.13)*.14)*(1-(y/h+.5)*.4);
     mp.setXYZ(k,x*j,y+Math.sin(x*.4+z*.3+i*2)*h*.04,z*j);
     t2.copy(base).lerp(peak,Math.max(0,y/h+.5)*.9);
     col.push(t2.r,t2.g,t2.b);
   }
   g.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
   const m=new THREE.Mesh(g,mtMat);
   m.position.set(Math.cos(a)*d,h*.5-8,Math.sin(a)*d);
   m.rotation.y=rand()*6;
   scene.add(m);
 }
}

 u.legs[0].rotation.x=THREE.MathUtils.lerp(u.legs[0].rotation.x,la,.35);

function updateWorldStructures(t){
  for(const f of worldStructureFx){
    if(f.type==='tower'){
      f.core.rotation.y=t*.9+f.phase;
      f.core.position.y=13.5+Math.sin(t*2+f.phase)*.18;
      f.halo.rotation.z=t*.7+f.phase;
    }else{
      if(f.ring) f.ring.rotation.z=t*.35+f.phase;
      if(f.frame) f.frame.rotation.y=Math.sin(t*.4+f.phase)*.08;
    }
  }
}

/* --- ship collision, floor and door logic --- */
function shipLocal(x,z){
 const th=ship.rotation.y,c=Math.cos(th),s=Math.sin(th);
 const dx=x-ship.position.x,dz=z-ship.position.z;
 return {lx:dx*c-dz*s,lz:dx*s+dz*c};
}
function insideShip(x,z){
 const q=shipLocal(x,z);
 return q.lx>-5.45&&q.lx<5.35&&Math.abs(q.lz)<2.3;
}
function groundHeight(x,z){
 return insideShip(x,z)?SHIP_FLOOR_Y:terrainHeight(x,z);
}
function collideWorld(pos,r){
 // ship walls and furniture
 const th=ship.rotation.y,c=Math.cos(th),s=Math.sin(th);
 const dx=pos.x-ship.position.x,dz=pos.z-ship.position.z;
 if(Math.abs(dx)<14&&Math.abs(dz)<14){
   let lx=dx*c-dz*s,lz=dx*s+dz*c;
   for(const b of shipColl){
     if(b.door&&doorOpen>.75)continue;
     const cx=Math.max(b.x-b.hx,Math.min(lx,b.x+b.hx));
     const cz=Math.max(b.z-b.hz,Math.min(lz,b.z+b.hz));
     const ddx=lx-cx,ddz=lz-cz,d2=ddx*ddx+ddz*ddz;
     if(d2<r*r){
       if(d2>1e-8){const d=Math.sqrt(d2),k=(r-d)/d;lx+=ddx*k;lz+=ddz*k}
       else{
         const px=b.hx-Math.abs(lx-b.x),pz=b.hz-Math.abs(lz-b.z);
         if(px<pz)lx+=(lx>=b.x?1:-1)*(px+r);else lz+=(lz>=b.z?1:-1)*(pz+r);
       }
     }
   }
   pos.x=ship.position.x+lx*c+lz*s;
   pos.z=ship.position.z-lx*s+lz*c;
 }
 // rocks and crates
 for(const o of solids){
   const ox=pos.x-o.x,oz=pos.z-o.z;
   if(Math.abs(ox)>o.r+r||Math.abs(oz)>o.r+r)continue;
   const d=Math.hypot(ox,oz),min=o.r+r;
   if(d<min&&d>1e-6){pos.x=o.x+ox/d*min;pos.z=o.z+oz/d*min}
 }
}

function updateShipFX(dt,t){
 // sliding door
 const pd=Math.hypot(player.position.x-doorWorld.x,player.position.z-doorWorld.z);
 const nd=Math.hypot(nova.position.x-doorWorld.x,nova.position.z-doorWorld.z);
 const target=(pd<4.6||(novaMode==="online"&&nd<3.2))?1:0;
 const diff=target-doorOpen;
 doorOpen+=Math.sign(diff)*Math.min(Math.abs(diff),dt*1.6);
 doorL.position.x=-1.95-doorOpen*.95;
 doorR.position.x=-1.05+doorOpen*.95;
 doorLightMat.color.setHex(doorOpen>.75?0x38ff88:0xff3030);

 // lights
 for(const f of shipLights){
   if(f.type==="flicker"){
     let v=.92+Math.sin(t*13)*.05;
     if(Math.sin(t*2.3)*Math.sin(t*5.1)>.82)v=.15+Math.random()*.25;
     f.l.intensity=f.base*v;
   }else if(f.type==="pulse"){
     f.l.intensity=f.base*(.8+.2*Math.sin(t*2.4));
   }else if(f.type==="alarm"){
     f.l.intensity=f.base*(.35+.65*Math.max(0,Math.sin(t*3.2)));
   }
 }
 // HEMTON core
 if(hemRings[0]){hemRings[0].rotation.y+=dt*1.3;hemRings[0].rotation.x=.4;hemRings[1].rotation.x+=dt*1.0;hemRings[1].rotation.z=.5}
 // screens flicker
 for(const m of screenMats){m.color.setScalar(.82+.18*Math.sin(t*9+m.userData.ph)*Math.sin(t*3.1+m.userData.ph))}
 beaconMat.color.setHex(Math.sin(t*4)>.3?0xff3030:0x300808);
 for(const s of sparkMeshes)s.visible=Math.random()<.35;

 // smoke
 for(const s of smokeSprites){
   const u=s.userData;
   u.age+=dt;if(u.age>u.life)u.age-=u.life;
   const k=u.age/u.life;
   s.position.set(u.ox+k*3.5,u.oy+k*8,u.oz+Math.sin(k*5+u.ox)*.6);
   const sc=1.4+k*5;s.scale.set(sc,sc,1);
   s.material.opacity=.42*(1-k)*Math.min(1,k*5);
 }
}

/* ---------- tweens ---------- */
const tweens=[];
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done})}
function updateTweens(dt){
 for(let i=tweens.length-1;i>=0;i--){
   const tw=tweens[i];
   tw.t+=dt;
   const k=Math.min(1,tw.t/tw.dur);
   tw.fn(k);
   if(k>=1){tweens.splice(i,1);if(tw.done)tw.done()}
 }
}

   case "WORKBENCH": return "BUILD WORKBENCH";
   case "NEUTRON": if(workbench&&dist2D(p,workbench.position)<4.5)return "BUILD NEUTRON";break;
   case "REPAIR": if(dist2D(p,nova.position)<5)return "USE NEUTRON ON NOVA";break;
   case "FOLLOW": if(dist2D(p,nova.position)<4)return "TALK TO NOVA";break;
 }
 return null;
}

function interact(){
 if(!started)return;
 if(speaking){if(dlgSkip)dlgSkip();return}
 if(busy)return;
 const act=currentAction();
 if(!act){fallbackTalk();return}

 if(state==="HEMTON"){
   setState("NOVA");
   speak("HEMTON",[
     "Critical systems failure detected.",
     "Life support 31%.",
     "Navigation offline.",
     "Communication unavailable...",
     "...and you're finally awake."
   ],()=>speak("HEMTON",["Short-range scan detected a damaged unit nearby.","Designation: NOVA. Follow the signal."]));
 }else if(state==="NOVA"){
   facePlayer();
   setState("GATHER");
   speak("NOVA",["My locomotion system is damaged...","I can't roll like this."],
     ()=>speak("HEMTON",["Repair requires a NEUTRON transfer device.","Salvage Metal, Energy and Components from the crash site."]));
 }else if(state==="WORKBENCH"){
   buildWorkbench();
 }else if(state==="NEUTRON"){
   buildNeutron();
 }else if(state==="REPAIR"){
   startRepair();
 }else if(state==="FOLLOW"){
   facePlayer();
   speak("NOVA",NOVA_HINT.FOLLOW);
 }
}

function fallbackTalk(){
 const p=player.position;
 if(dist2D(p,nova.position)<5&&NOVA_HINT[state]){facePlayer();speak("NOVA",NOVA_HINT[state]);return}
 if(dist2D(p,nova.position)<5){facePlayer();speak("NOVA",["...locomotion... damaged..."]);return}
 if(insideShip(p.x,p.z)&&HEMTON_HINT[state]){speak("HEMTON",HEMTON_HINT[state]);return}
 if(state==="HEMTON"){toast("Enter the crashed ship to find HEMTON.",2200);return}
 toast("Nothing useful here.",1400);
}
function facePlayer(){
 if(novaMode==="damaged"||novaMode==="repairing")
   nova.rotation.y=Math.atan2(player.position.x-nova.position.x,player.position.z-nova.position.z);
}

function buildWorkbench(){
 if(dist2D(player.position,ship.position)<12){toast("Too close to the wreckage. Step back and try again.",2200);return}
 if(!hasCost(WB_COST)){toast("Not enough materials.");return}
 spend(WB_COST);
 workbench=makeWorkbench();
 const x=player.position.x-Math.sin(yaw)*3,z=player.position.z-Math.cos(yaw)*3;
 workbench.position.set(x,terrainHeight(x,z),z);
 workbench.rotation.y=yaw;
 workbench.scale.setScalar(.01);
 scene.add(workbench);
 solids.push({x,z,r:1.1});
 neutronDevice=makeNeutronDevice();
 busy=true;
 tween(.9,k=>{const e=1-Math.pow(1-k,3);workbench.scale.setScalar(.01+.99*e)},()=>{busy=false});
 setState("NEUTRON");
 toast("WORKBENCH BUILT");
 speak("HEMTON",["Workbench online.","NEUTRON schematics loaded."]);
}

function buildNeutron(){
 if(!hasCost(NEUT_COST)){toast("Not enough materials.");return}
 busy=true;
 showProgress("ASSEMBLING NEUTRON");
 const base=workbench.position;
 neutronDevice.visible=true;
 tween(2.4,k=>{
   progFill.style.width=(k*100)+"%";
   neutronDevice.position.set(base.x,base.y+1.3+k*.5,base.z);
   neutronDevice.scale.setScalar(.2+.8*k);
   neutronDevice.rotation.y+=.12;
 },()=>{
   spend(NEUT_COST);
   neutronBuilt=true; refreshInv("neutron");
   hideProgress();
   setState("REPAIR");
   toast("NEUTRON ACQUIRED");
   const from=neutronDevice.position.clone();
   tween(.8,k=>{
     const to=new THREE.Vector3(player.position.x,player.position.y+1.5,player.position.z);
     neutronDevice.position.lerpVectors(from,to,k);
     neutronDevice.scale.setScalar(1-.8*k);
   },()=>{neutronDevice.visible=false;busy=false});
   speak("HEMTON",["NEUTRON assembled.","Transfer repair data to NOVA."]);
 });
}

function startRepair(){
 busy=true; novaMode="repairing";
 facePlayer();
 showProgress("TRANSFERRING REPAIR DATA");
 const gy=terrainHeight(nova.position.x,nova.position.z);
 tween(3.4,k=>{
   progFill.style.width=(k*100)+"%";
   const t=performance.now()*.001;
   const a=new THREE.Vector3(player.position.x,player.position.y+1.5,player.position.z);
   const b=new THREE.Vector3(nova.position.x,nova.position.y,nova.position.z);
   setLink(a,b,t);
   player.rotation.y=Math.atan2(nova.position.x-player.position.x,nova.position.z-player.position.z);
   nova.position.y=gy+.52+(.13*k)+Math.sin(k*Math.PI)*.9;
   nova.rotation.z=.28*(1-k)+Math.sin(k*40)*.05*(1-k);
   novaBall.rotation.x+=.25;
   const flick=Math.sin(t*40)>(1-k*1.6);
   novaEyeMat.color.setHex(flick?0x9d72ff:0x3a2658);
 },()=>{
   linkBeam.visible=false;
   hideProgress();
   novaMode="online";
   novaEyeMat.color.setHex(0x9d72ff);
   setState("FOLLOW");
   busy=false;
   speak("NOVA",["Locomotion restored.","Thank you. I will follow you."],
     ()=>toast("NOVA IS NOW YOUR COMPANION",3000));
 });
}

/* ---------- waypoint ---------- */
function getWaypoint(){
 switch(state){
   case "HEMTON": return {pos:hemtonPos,name:"HEMTON",txt:"GO TO THE CRASHED SHIP",css:"#b99cff",col:0xa070ff,lift:4.8};
   case "NOVA": return {pos:nova.position,name:"NOVA SIGNAL",txt:"FOLLOW THE SIGNAL TO NOVA",css:"#7fe3ff",col:0x6fe0ff,lift:3.5};
   case "GATHER":{
     let best=null,bd=1e9;
     for(const g of pickups){
       if(inv[g.userData.type]>=NEED[g.userData.type])continue;
       const d=dist2D(player.position,g.position);
       if(d<bd){bd=d;best=g}
     }
     const txt="METAL "+Math.min(inv.metal,NEED.metal)+"/"+NEED.metal+" • ENERGY "+Math.min(inv.energy,NEED.energy)+"/"+NEED.energy+" • COMPONENTS "+Math.min(inv.parts,NEED.parts)+"/"+NEED.parts;
     if(!best)return {pos:null,txt,noDist:true};
     const t=best.userData.type;
     return {pos:best.position,name:RES[t].label,txt,noDist:true,css:RES[t].css,col:RES[t].color,lift:1.5};
   }
   case "WORKBENCH": return {pos:null,txt:"FIND OPEN GROUND • PRESS USE TO BUILD",noDist:true};
   case "NEUTRON": return workbench?{pos:workbench.position,name:"WORKBENCH",txt:"GO TO THE WORKBENCH",css:"#b99cff",col:0xa070ff,lift:3}:null;
   case "REPAIR": return {pos:nova.position,name:"NOVA",txt:"BRING THE NEUTRON TO NOVA",css:"#7fe3ff",col:0x6fe0ff,lift:3};
   case "FOLLOW": return {pos:null,txt:"NOVA IS NOW YOUR COMPANION • EXPLORE AURELIS",noDist:true};
 }
 return null;
}

function updateWaypoint(){
 const w=getWaypoint();
 if(!w){wpEl.style.display="none";beamG.visible=false;return}
 if(!w.pos){wpEl.style.display="none";beamG.visible=false;setSub(w.txt);return}

 const d=Math.hypot(w.pos.x-player.position.x,w.pos.z-player.position.z);
 setSub(w.noDist?w.txt:w.txt+" • "+Math.round(d)+"m");

 const gy=terrainHeight(w.pos.x,w.pos.z);
 beamG.position.set(w.pos.x,gy,w.pos.z);
 beamMat.color.setHex(w.col);
 beamG.visible=d>3;

 const world=new THREE.Vector3(w.pos.x,gy+w.lift,w.pos.z);
 const cam=world.clone().applyMatrix4(camera.matrixWorldInverse);
 const behind=cam.z>0;
 const v=world.clone().project(camera);
 const W=innerWidth,H=innerHeight;
 let sx=(v.x*.5+.5)*W,sy=(-v.y*.5+.5)*H;
 if(behind){sx=W-sx;sy=H-sy}
 const m=46;
 const off=behind||sx<m||sx>W-m||sy<m||sy>H-m;
 let ang=0;
 if(off){
   const cx=W/2,cy=H/2;
   let dx=sx-cx,dy=sy-cy;
   if(Math.abs(dx)<1e-3&&Math.abs(dy)<1e-3)dy=1;
   ang=Math.atan2(dy,dx);
   const k=Math.min((cx-m)/Math.max(Math.abs(dx),1e-3),(cy-m)/Math.max(Math.abs(dy),1e-3));
   sx=cx+dx*k; sy=cy+dy*k;
 }
 wpEl.style.display="block";
 wpEl.style.setProperty("--c",w.css);
 wpEl.style.transform="translate("+sx+"px,"+sy+"px)";
 wpDia.style.display=off?"none":"block";
 wpArr.style.display=off?"block":"none";
 wpArr.style.transform="rotate("+ang+"rad)";
 wpLbl.textContent=w.name+" • "+Math.round(d)+"m";
}

/* ============================================================
   SETUP
   ============================================================ */
function setup(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x1a0d16);
 scene.fog=new THREE.FogExp2(0x5a2f3a,.0034);

 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,1500);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFShadowMap;
 game.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 initTextures();
 createEnvironment();
 createTerrain();
 createWorldStructures();
 createNova();
 createShip();
 createPlayer();
 createBeacon();
 spawnPickups();
 buildInv();
 refreshInv();

 window.addEventListener("resize",resize);
 window.addEventListener("keydown",e=>{
   keys[e.code]=true;
   if(e.repeat)return;
   if(e.code==="KeyE")interact();
   if(e.code==="Space"){e.preventDefault();jump()}
   if(e.code==="KeyC")toggleCam();
 });
 window.addEventListener("keyup",e=>keys[e.code]=false);

 setupJoystick();
 setupLook();
 setupButtons();
 animate();
}

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

/* ---------- input ---------- */
function setupJoystick(){
 function start(e){
   if(!started || e.pointerType==="mouse")return;
   e.preventDefault();
   joystickActive=true; joyId=e.pointerId;
   joystick.style.left=(e.clientX-66)+"px";
   joystick.style.top=(e.clientY-66)+"px";
   joystick.style.display="block";
   updateJoy(e.clientX,e.clientY);
 }
 function move(e){
   if(!joystickActive || e.pointerId!==joyId)return;
   e.preventDefault(); updateJoy(e.clientX,e.clientY);
 }
 function end(e){
   if(e.pointerId!==joyId)return;
   joystickActive=false; joyId=null; joyX=0; joyY=0;
   stick.style.transform="translate(0,0)";
   joystick.style.display="none";
 }
 joystickZone.addEventListener("pointerdown",start);
 joystickZone.addEventListener("pointermove",move);
 joystickZone.addEventListener("pointerup",end);
 joystickZone.addEventListener("pointercancel",end);

 function updateJoy(x,y){
   const cx=parseFloat(joystick.style.left)+66;
   const cy=parseFloat(joystick.style.top)+66;
   let dx=x-cx,dy=y-cy;
   const max=48;
   const len=Math.hypot(dx,dy);
   if(len>max){dx=dx/len*max;dy=dy/len*max}
   joyX=dx/max;          // right = +X
   joyY=-dy/max;         // up on screen = forward
   stick.style.transform="translate("+dx+"px,"+dy+"px)";
 }
}

function setupLook(){
 lookArea.addEventListener("pointerdown",e=>{
   if(!started || e.pointerType==="mouse")return;
   lookId=e.pointerId;
   lastLookX=e.clientX; lastLookY=e.clientY;
   lookArea.setPointerCapture(e.pointerId);
 });
 lookArea.addEventListener("pointermove",e=>{
   if(e.pointerId!==lookId)return;
   const dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;
   lastLookX=e.clientX; lastLookY=e.clientY;
   yaw-=dx*.006;
   pitch-=dy*.004;
   pitch=THREE.MathUtils.clamp(pitch,-.75,.8);
 });
 lookArea.addEventListener("pointerup",e=>{if(e.pointerId===lookId)lookId=null});
 lookArea.addEventListener("pointercancel",e=>{if(e.pointerId===lookId)lookId=null});
}

function toggleCam(){
 thirdPerson=!thirdPerson;
 toast(thirdPerson?"THIRD-PERSON CAMERA":"FIRST-PERSON CAMERA",1200);
}
function jump(){
 if(!started)return;
 if(grounded){velocityY=7.6;grounded=false}
}

function setupButtons(){
 document.getElementById("play").addEventListener("click",async()=>{
   started=true;
   document.getElementById("start").style.display="none";
   try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}
   try{if(screen.orientation?.lock)await screen.orientation.lock("landscape")}catch(e){}
   toast("AURELIS — SYSTEM ONLINE",2200);
 });
 document.getElementById("camBtn").addEventListener("pointerdown",e=>{e.preventDefault();toggleCam()});
 document.getElementById("useBtn").addEventListener("pointerdown",e=>{e.preventDefault();interact()});
 document.getElementById("jumpBtn").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
}

/* ---------- per-frame updates ---------- */
function updatePlayer(dt){
 let ix=joyX, iz=joyY;
 if(keys.KeyA)ix-=1;
 if(keys.KeyD)ix+=1;
 if(keys.KeyW)iz+=1;
 if(keys.KeyS)iz-=1;

 const len=Math.hypot(ix,iz);
 if(len>1){ix/=len;iz/=len}

 // Camera forward = (-sin yaw, -cos yaw), camera right = (cos yaw, -sin yaw)
 const sin=Math.sin(yaw),cos=Math.cos(yaw);
 const worldX=ix*cos - iz*sin;
 const worldZ=-ix*sin - iz*cos;

 const targetX=worldX*4.5,targetZ=worldZ*4.5;
 const smooth=1-Math.pow(.001,dt);
 velocityX+=(targetX-velocityX)*smooth;
 velocityZ+=(targetZ-velocityZ)*smooth;

 const p=player.position;
 p.x=THREE.MathUtils.clamp(p.x+velocityX*dt,-235,235);
 p.z=THREE.MathUtils.clamp(p.z+velocityZ*dt,-235,235);
 collideWorld(p,.42);

 // gravity and jump
 velocityY-=22*dt;
 p.y+=velocityY*dt;
 const gy=groundHeight(p.x,p.z);
 if(p.y<=gy+.05 && velocityY<=0){
   p.y=gy; velocityY=0; grounded=true;
 }else{
   grounded=false;
 }

 const speed=Math.hypot(velocityX,velocityZ);
 if(!busy && speed>.15){
   player.rotation.y=Math.atan2(velocityX,velocityZ);
 }
 animatePlayer(dt,speed,performance.now()*.001);
}

function updateCamera(){
 const p=player.position;
 const inShip=insideShip(p.x,p.z);
 player.visible=thirdPerson;

 if(thirdPerson){
   const target=new THREE.Vector3(p.x,p.y+1.55,p.z);
   const dist=inShip?2.8:5.5;
   const h=Math.cos(pitch)*dist;
   camera.position.set(
     target.x+Math.sin(yaw)*h,
     target.y+2.2-Math.sin(pitch)*dist,
     target.z+Math.cos(yaw)*h
   );
   if(inShip){
     const q=shipLocal(camera.position.x,camera.position.z);
     if(q.lx<-5.1||q.lx>5.1||Math.abs(q.lz)>2.05||camera.position.y>SHIP_FLOOR_Y+2.6){
       camera.position.set(target.x+Math.sin(yaw)*1.4,Math.min(target.y+.7,SHIP_FLOOR_Y+2.5),target.z+Math.cos(yaw)*1.4);
     }
   }else{
     const minY=terrainHeight(camera.position.x,camera.position.z)+.5;
     if(camera.position.y<minY)camera.position.y=minY;
   }
   camera.lookAt(target);
 }else{
   camera.position.set(p.x,p.y+1.62,p.z);
   camera.rotation.order="YXZ";
   camera.rotation.y=yaw;
   camera.rotation.x=pitch;
 }
 camera.updateMatrixWorld();
}

function updatePickups(dt,t){
 for(let i=pickups.length-1;i>=0;i--){
   const g=pickups[i];
   g.rotation.y+=dt*1.6;
   g.position.y=g.userData.y0+Math.sin(t*2.2+g.userData.ph)*.14;
   if(dist2D(player.position,g.position)<2.1)collect(g);
 }
}

function updateNova(dt,t){
 novaSensor.rotation.y+=dt*(novaMode==="online"?3:(novaMode==="repairing"?6:.7));
 if(novaMode==="damaged"){
   const gy=terrainHeight(nova.position.x,nova.position.z);
   nova.position.y=gy+.52;
   nova.rotation.z=.28+Math.sin(t*6)*.008;
   novaEyeMat.color.setHex((Math.sin(t*23)*Math.sin(t*7)>.55)?0x9d72ff:0x3a2658);
   return;
 }
 if(novaMode!=="online")return;

 const nx=nova.position.x,nz=nova.position.z;
 const dx=player.position.x-nx,dz=player.position.z-nz;
 const d=Math.hypot(dx,dz);
 let step=0;
 if(d>60){
   nova.position.x=player.position.x+Math.sin(yaw)*3;
   nova.position.z=player.position.z+Math.cos(yaw)*3;
 }else if(d>3.4){
   const speed=Math.min(5.4,(d-3.4)*2.2+1.3);
   step=speed*dt;
   nova.position.x+=dx/d*step;
   nova.position.z+=dz/d*step;
   collideWorld(nova.position,.65);
 }
 nova.rotation.y=lerpAngle(nova.rotation.y,Math.atan2(dx,dz),1-Math.pow(.0008,dt));
 nova.rotation.z*=Math.pow(.001,dt);
 novaBall.rotation.x+=step/.65;
 const bob=step>0?0:Math.sin(t*3)*.035;
 nova.position.y=groundHeight(nova.position.x,nova.position.z)+.65+bob;
 novaEyeMat.color.setHex(0x9d72ff);
}

function updatePrompt(){
 const a=currentAction();
 if(a){
   const txt="USE • "+a;
   if(promptEl.textContent!==txt)promptEl.textContent=txt;
   promptEl.style.display="block";
 }else{
   promptEl.style.display="none";
 }
}

const SUN_OFF=new THREE.Vector3(-55,42,38);
const WIND=new THREE.Vector3(1.4,.1,.5);
function updateWorldFX(dt){
 sky.position.copy(camera.position);
 sun.position.copy(player.position).add(SUN_OFF);
 sun.target.position.copy(player.position);
 sun.target.updateMatrixWorld();
 // dust follows the camera and drifts in the wind
 if(dust.visible){
   const a=dust.geometry.attributes.position.array;
   const cx=camera.position.x,cy=camera.position.y,cz=camera.position.z;
   for(let i=0;i<dustPos.length;i+=3){
     dustPos[i]+=WIND.x*dt;dustPos[i+1]+=WIND.y*dt+Math.sin(dustPos[i]*.5)*dt*.2;dustPos[i+2]+=WIND.z*dt;
     if(dustPos[i]>20)dustPos[i]-=40;else if(dustPos[i]<-20)dustPos[i]+=40;
     if(dustPos[i+1]>10)dustPos[i+1]-=10;else if(dustPos[i+1]<0)dustPos[i+1]+=10;
     if(dustPos[i+2]>20)dustPos[i+2]-=40;else if(dustPos[i+2]<-20)dustPos[i+2]+=40;
     a[i]=cx+dustPos[i];a[i+1]=cy-3+dustPos[i+1];a[i+2]=cz+dustPos[i+2];
   }
   dust.geometry.attributes.position.needsUpdate=true;
 }
}

/* automatic performance fallback for slower phones */
let perfT=0,perfFrames=0,perfSum=0,perfLevel=0,perfOk=0;
function perfCheck(dt){
 if(perfLevel>=2||perfOk>=2)return;
 perfT+=dt;if(perfT<2)return;
 perfFrames++;perfSum+=dt;
 if(perfFrames>=150){
   const avg=perfSum/perfFrames;perfFrames=0;perfSum=0;
   if(avg>.038){
     perfLevel++;perfOk=0;
     if(perfLevel===1){
       sun.castShadow=false;
       renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
       toast("PERFORMANCE MODE");
     }else{
       renderer.setPixelRatio(1);
       dust.visible=false;
     }
     renderer.setSize(innerWidth,innerHeight);
   }else perfOk++;
 }
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 const t=performance.now()*.001;
 if(started){
   updatePlayer(dt);
   updateTweens(dt);
   updatePickups(dt,t);
   updateNova(dt,t);
   updateShipFX(dt,t);
   updateCamera();
   updateWorldFX(dt);
   updateWorldStructures(t);
   if(beamG.visible){
     beamMat.opacity=.22+Math.sin(t*3)*.08;
     const ring=beamG.getObjectByName("ring");
     ring.scale.setScalar(1+((t*.8)%1)*.5);
   }
   updateWaypoint();
   updatePrompt();
   perfCheck(dt);
 }
 renderer.render(scene,camera);
}

loading.textContent="Loading AURELIS...";
setup();
